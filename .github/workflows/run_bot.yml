name: Quant Bot 15-Min Scanner

on:
  schedule:
    # Runs every 15 minutes (with a slight offset to reduce queue delays)
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch: # Allows manual testing from the GitHub Actions tab

permissions:
  contents: write  # Grants permissions to commit backtest_signals.csv back to the repository

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Quant Bot Script
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python live_quant_bot.py

      - name: Commit and push backtest log if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest_signals.csv || true
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-update backtest signal log"
          git push || true
