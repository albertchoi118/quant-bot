name: Live Quant Bot

on:
  schedule:
    # Runs every 10 minutes, Monday through Friday, between 14:00 and 21:50 UTC 
    # (Covers US Market hours 9:30 AM - 4:00 PM ET across both EST and EDT shifts)
    - cron: '*/10 14-21 * * 1-5'
  workflow_dispatch:              # Allows manual runs from the GitHub Actions tab

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Pull down your repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python with Pip Caching enabled
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'          # Caches your pip packages to speed up builds

      # 3. Install dependencies from requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Execute the bot script passing in your GitHub Secrets
      - name: Run Quant Scanner
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python live_quant_bot.py

      # 5. Automatically commit the updated CSV log back to the repository (if it exists)
      - name: Commit backtest_signals.csv changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f backtest_signals.csv ]; then
            git add backtest_signals.csv
            git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update backtest signals log [skip ci]" && git push)
          else
            echo "No signals file generated during this run. Skipping commit."
          fi
