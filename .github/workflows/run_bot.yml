name: Live Quant Bot

on:
  schedule:
    - cron: '5,20,35,50 * * * *'  # Runs every 15 minutes past the hour
  workflow_dispatch:              # Allows manual runs from the GitHub Actions tab

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Pull down your repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python with Pip Caching enabled
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'          # Caches your pip packages to speed up builds

      # 3. Install dependencies from requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Execute the bot script passing in your GitHub Secrets
      - name: Run Quant Scanner
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python live_quant_bot.py

      # 5. Automatically commit the updated CSV log back to the repository
      - name: Commit backtest_signals.csv changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest_signals.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update backtest signals log [skip ci]" && git push)
